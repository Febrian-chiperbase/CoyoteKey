name: 🚀 CoyoteKey CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # Code Quality and Security Checks
  quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐹 Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: 📦 Cache Go Modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: 📥 Download Dependencies
      run: go mod download

    - name: 🔍 Go Vet
      run: go vet ./...

    - name: 🧹 Go Fmt Check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted properly:"
          gofmt -s -l .
          exit 1
        fi

    - name: 🔒 Security Scan with Gosec
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec.sarif ./...'

    - name: 📊 Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: gosec.sarif

  # Unit Tests
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.20', '1.21']
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐹 Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: 📦 Cache Go Modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}

    - name: 📥 Download Dependencies
      run: go mod download

    - name: 🧪 Run Tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: 📊 Upload Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # Build Multi-Platform Binaries
  build:
    name: 🏗️ Build Binaries
    runs-on: ubuntu-latest
    needs: [quality, test]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐹 Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: 📦 Cache Go Modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: 📥 Download Dependencies
      run: go mod download

    - name: 🏗️ Build Binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        if [ "${{ matrix.os }}" = "windows" ]; then
          go build -ldflags="-s -w" -o dist/coyotekey-${{ matrix.os }}-${{ matrix.arch }}.exe CoyoteKey.go
        else
          go build -ldflags="-s -w" -o dist/coyotekey-${{ matrix.os }}-${{ matrix.arch }} CoyoteKey.go
        fi

    - name: 📦 Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coyotekey-${{ matrix.os }}-${{ matrix.arch }}
        path: dist/

  # Integration Tests
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: coyotekey_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐹 Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: 📥 Download Linux Binary
      uses: actions/download-artifact@v3
      with:
        name: coyotekey-linux-amd64
        path: ./

    - name: 🔧 Make Binary Executable
      run: chmod +x coyotekey-linux-amd64

    - name: 🧪 Run Integration Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: coyotekey_test
        DB_USER: postgres
        DB_PASS: testpass
      run: |
        # Test basic functionality
        echo "api_key_test_123" > test_wordlist.txt
        timeout 30 ./coyotekey-linux-amd64 -u https://httpbin.org/bearer -w test_wordlist.txt -v -t 1 -s "200,401" || true
        
        # Test database integration
        timeout 30 ./coyotekey-linux-amd64 -u https://httpbin.org/bearer -w test_wordlist.txt -db -db-type postgres -db-host $DB_HOST -db-port $DB_PORT -db-name $DB_NAME -db-user $DB_USER -db-password $DB_PASS -v -t 1 || true
        
        # Test web dashboard
        timeout 15 ./coyotekey-linux-amd64 -web -web-port 8080 -v &
        sleep 5
        curl -f http://localhost:8080 || echo "Web dashboard test completed"

  # Security Scanning
  security:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔍 Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📊 Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Performance Tests
  performance:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📥 Download Linux Binary
      uses: actions/download-artifact@v3
      with:
        name: coyotekey-linux-amd64
        path: ./

    - name: 🔧 Make Binary Executable
      run: chmod +x coyotekey-linux-amd64

    - name: ⚡ Performance Benchmark
      run: |
        echo "Generating large wordlist for performance test..."
        for i in {1..1000}; do echo "test_key_$i"; done > perf_wordlist.txt
        
        echo "Running performance test..."
        time timeout 60 ./coyotekey-linux-amd64 -u https://httpbin.org/bearer -w perf_wordlist.txt -t 10 -r 50 -v || true

  # Release
  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [quality, test, build, integration, security]
    if: github.event_name == 'release'
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📥 Download All Artifacts
      uses: actions/download-artifact@v3

    - name: 📦 Prepare Release Assets
      run: |
        mkdir -p release
        for dir in coyotekey-*; do
          if [ -d "$dir" ]; then
            cd "$dir"
            if ls coyotekey-*.exe 1> /dev/null 2>&1; then
              zip -r "../release/${dir}.zip" coyotekey-*.exe
            else
              tar -czf "../release/${dir}.tar.gz" coyotekey-*
            fi
            cd ..
          fi
        done

    - name: 🚀 Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        body: |
          ## 🚀 CoyoteKey Release
          
          ### ✨ Features
          - Enterprise API Security Testing Platform
          - Modern Web-based GUI Dashboard
          - Machine Learning Integration
          - Database Integration & Analytics
          - Advanced Authentication Methods
          - Smart Evasion Techniques
          
          ### 📦 Downloads
          Choose the appropriate binary for your platform:
          - **Linux AMD64**: `coyotekey-linux-amd64.tar.gz`
          - **Linux ARM64**: `coyotekey-linux-arm64.tar.gz`
          - **Windows AMD64**: `coyotekey-windows-amd64.zip`
          - **macOS AMD64**: `coyotekey-darwin-amd64.tar.gz`
          - **macOS ARM64**: `coyotekey-darwin-arm64.tar.gz`
          
          ### 🚀 Quick Start
          ```bash
          # Extract and run
          tar -xzf coyotekey-linux-amd64.tar.gz
          ./coyotekey-linux-amd64 -h
          
          # Start GUI
          ./coyotekey-linux-amd64 -web -web-port 8080
          ```
          
          ### 📚 Documentation
          - [README.md](README.md) - Complete documentation
          - [GUI_README.md](GUI_README.md) - GUI documentation
          - [CONTRIBUTING.md](CONTRIBUTING.md) - Contribution guidelines
          - [SECURITY.md](SECURITY.md) - Security policy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notification
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [quality, test, build, integration, security]
    if: always()
    steps:
    - name: 📢 Workflow Summary
      run: |
        echo "## 🚀 CoyoteKey CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- Quality Check: ${{ needs.quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.quality.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ All checks passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some checks failed. Please review and fix issues." >> $GITHUB_STEP_SUMMARY
        fi
